[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xcron-capability-scheduler-native"
version = "0.1.4"
description = "Native cron and launchd schedule-control provider for xcron"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
  "xcron-contracts==0.1.4",
  "xcron-kernel==0.1.4",
]

[project.entry-points."xcron.capabilities"]
scheduler-native = "xcron.capabilities.scheduler_native.provider:CAPABILITY"

[tool.uv.sources]
xcron-contracts = { workspace = true }
xcron-kernel = { workspace = true }

[tool.setuptools]
packages = ["xcron.capabilities.scheduler_native", "xcron.capabilities.scheduler_native.adapters"]

[tool.setuptools.package-dir]
"" = "src"
