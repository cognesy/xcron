[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xcron-capability-manifest-yaml"
version = "0.1.1"
description = "YAML manifest validation, hashing, and editing provider for xcron"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
  "PyYAML>=6.0,<7.0",
  "jsonschema>=4.23,<5.0",
  "xcron-contracts==0.1.1",
  "xcron-kernel==0.1.1",
]

[project.entry-points."xcron.capabilities"]
manifest-yaml = "xcron.capabilities.manifest_yaml.provider:CAPABILITY"

[tool.uv.sources]
xcron-contracts = { workspace = true }
xcron-kernel = { workspace = true }

[tool.setuptools]
include-package-data = true
packages = [
    "xcron.capabilities.manifest_yaml",
  "xcron.capabilities.manifest_yaml.resources",
  "xcron.capabilities.manifest_yaml.resources.schemas",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"xcron.capabilities.manifest_yaml.resources.schemas" = ["*.yaml"]
