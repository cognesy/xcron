[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xcron-capability-observability-structlog"
version = "0.1.0"
description = "Structlog observability provider for xcron"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
  "PyYAML>=6.0,<7.0",
  "structlog>=24.0,<26.0",
  "xcron-contracts==0.1.0",
  "xcron-kernel==0.1.0",
]

[project.entry-points."xcron.capabilities"]
observability-structlog = "xcron.capabilities.observability_structlog.provider:CAPABILITY"

[tool.uv.sources]
xcron-contracts = { workspace = true }
xcron-kernel = { workspace = true }

[tool.setuptools]
include-package-data = true
packages = [
    "xcron.capabilities.observability_structlog",
  "xcron.capabilities.observability_structlog.resources",
  "xcron.capabilities.observability_structlog.resources.logging",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"xcron.capabilities.observability_structlog.resources.logging" = ["*.yaml"]
