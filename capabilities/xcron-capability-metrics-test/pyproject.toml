[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xcron-capability-metrics-test"
version = "0.1.1"
description = "Deterministic alternate metrics provider used by xcron package proofs"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
  "xcron-contracts==0.1.1",
  "xcron-kernel==0.1.1",
]

[project.entry-points."xcron.capabilities"]
metrics-test = "xcron.capabilities.metrics_test.provider:CAPABILITY"

[tool.uv.sources]
xcron-contracts = { workspace = true }
xcron-kernel = { workspace = true }

[tool.setuptools]
packages = ["xcron.capabilities.metrics_test"]

[tool.setuptools.package-dir]
"" = "src"
