[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xcron"
version = "0.1.0"
description = "Per-project schedule reconciliation prototype for native OS schedulers"
readme = "SPEC.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [
  { name = "Dariusz Debowczyk" }
]
dependencies = [
  "PyYAML>=6.0,<7.0",
  "jsonschema>=4.23,<5.0",
  "pydantic>=2.12.5",
  "python-toon>=0.1.3",
  "rich>=14.3.3",
  "structlog>=24.0,<26.0",
  "typer>=0.23.2",
  # `xcfg` is a portfolio library, not published to any index. A PEP 508 direct
  # reference is what makes the built wheel installable outside this checkout;
  # a bare version specifier would resolve against PyPI and fail. The tag is
  # pinned because the layer order xcfg implements is part of xcron's own
  # observable configuration contract.
  "xcfg @ git+https://github.com/cognesy/xcfg@v0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
xcron = "xcron_cli.typer_app:run"

[tool.setuptools]
include-package-data = true
packages = [
  "xcron_cli",
  "xcron_cli.presenters",
  "xcron_cli.resources",
  "xcron_cli.resources.help",
  "xcron_cli.resources.help.jobs",
  "xcron_libs",
  "xcron_libs.actions",
  "xcron_libs.capabilities",
  "xcron_libs.capabilities.agent_hooks",
  "xcron_libs.capabilities.jobs",
  "xcron_libs.capabilities.manifest",
  "xcron_libs.capabilities.manifest.resources",
  "xcron_libs.capabilities.manifest.resources.schemas",
  "xcron_libs.capabilities.operations",
  "xcron_libs.capabilities.reconciliation",
  "xcron_libs.capabilities.reconciliation.adapters",
  "xcron_libs.capabilities.workspace",
  "xcron_libs.configuration",
  "xcron_libs.configuration.resources",
  "xcron_libs.configuration.resources.config",
  "xcron_libs.domain",
  "xcron_libs.runtime",
  "xcron_libs.sdk",
  "xcron_libs.shared",
  "xcron_libs.shared.resources",
  "xcron_libs.shared.resources.logging",
]

[tool.setuptools.package-dir]
xcron_cli = "apps/cli"
xcron_libs = "libs"

[tool.setuptools.package-data]
"xcron_cli.resources.help" = ["*.md", "jobs/*.md"]
"xcron_cli.resources.help.jobs" = ["*.md"]
"xcron_libs.capabilities.manifest.resources.schemas" = ["*.yaml"]
"xcron_libs.configuration.resources.config" = ["*.yaml"]
"xcron_libs.shared.resources.logging" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
