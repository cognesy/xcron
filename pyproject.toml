[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xcron"
version = "0.1.0"
description = "Per-project schedule reconciliation prototype for native OS schedulers"
readme = "SPEC.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [
  { name = "Dariusz Debowczyk" }
]
# The library half of xcron: the SDK, the capabilities, and the domain. A
# program that embeds `Xcron` pulls in no terminal renderer.
dependencies = [
  "PyYAML>=6.0,<7.0",
  "jsonschema>=4.23,<5.0",
  "pydantic>=2.12.5",
  "structlog>=24.0,<26.0",
  # `xcfg` is a portfolio library, not published to any index. A PEP 508 direct
  # reference is what makes the built wheel installable outside this checkout;
  # a bare version specifier would resolve against PyPI and fail. The tag is
  # pinned because the layer order xcfg implements is part of xcron's own
  # observable configuration contract.
  "xcfg @ git+https://github.com/cognesy/xcfg@v0.5.0",
]

[project.optional-dependencies]
# The `xcron` console script is a CLI channel, so it needs the channel's
# renderers. Nothing under `libs/` may import them; the architecture tests
# enforce that, which is what makes this split safe rather than cosmetic.
cli = [
  "python-toon>=0.1.3",
  "rich>=14.3.3",
  "typer>=0.23.2",
]
dev = [
  "pytest>=8.0,<9.0",
]

# The test suite exercises the CLI channel, so a bare `uv run pytest` has to
# see the `cli` extra. uv installs this group by default, which is what keeps
# the split from turning every CLI test red.
[dependency-groups]
dev = [
  "import-linter>=2.13",
  "pytest>=8.0,<9.0",
  "xcron[cli]",
]

[project.scripts]
xcron = "xcron_cli.typer_app:run"

[tool.setuptools]
include-package-data = true
packages = [
  "xcron_cli",
  "xcron_cli.presenters",
  "xcron_cli.resources",
  "xcron_cli.resources.help",
  "xcron_cli.resources.help.jobs",
  "xcron_libs",
  "xcron_libs.capabilities",
  "xcron_libs.capabilities.agent_hooks",
  "xcron_libs.capabilities.jobs",
  "xcron_libs.capabilities.manifest",
  "xcron_libs.capabilities.manifest.resources",
  "xcron_libs.capabilities.manifest.resources.schemas",
  "xcron_libs.capabilities.operations",
  "xcron_libs.capabilities.reconciliation",
  "xcron_libs.capabilities.reconciliation.adapters",
  "xcron_libs.capabilities.workspace",
  "xcron_libs.configuration",
  "xcron_libs.configuration.resources",
  "xcron_libs.configuration.resources.config",
  "xcron_libs.domain",
  "xcron_libs.runtime",
  "xcron_libs.sdk",
  "xcron_libs.shared",
  "xcron_libs.shared.resources",
  "xcron_libs.shared.resources.logging",
]

[tool.setuptools.package-dir]
xcron_cli = "apps/cli"
xcron_libs = "libs"

[tool.setuptools.package-data]
"xcron_cli" = ["py.typed"]
"xcron_libs" = ["py.typed"]
"xcron_cli.resources.help" = ["*.md", "jobs/*.md"]
"xcron_cli.resources.help.jobs" = ["*.md"]
"xcron_libs.capabilities.manifest.resources.schemas" = ["*.yaml"]
"xcron_libs.configuration.resources.config" = ["*.yaml"]
"xcron_libs.shared.resources.logging" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Import Linter states the dependency graph as data. The AST tests in
# `tests/architecture/` still own what a graph cannot express — which *file*
# inside a module may be imported, and which files may read the environment —
# but "who may depend on whom" is said once, here, in a form that is checked
# rather than described.
[tool.importlinter]
root_packages = ["xcron_cli", "xcron_libs"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The stack has one direction"
type = "layers"
layers = [
  "xcron_cli",
  "xcron_libs.sdk",
  "xcron_libs.runtime",
  "xcron_libs.capabilities",
  "xcron_libs.configuration | xcron_libs.domain | xcron_libs.shared",
]

[[tool.importlinter.contracts]]
# Not `independence`: the capabilities do have edges, and the point is that
# they form a DAG rather than a mesh. Anything in a layer is independent of
# its siblings, so a new `jobs -> operations` import fails here.
name = "Capabilities form a DAG, not a mesh"
type = "layers"
containers = ["xcron_libs.capabilities"]
layers = [
  "agent_hooks | jobs | operations",
  "reconciliation",
  "manifest",
  "workspace",
]

[[tool.importlinter.contracts]]
# Reconciliation reports what it did through the OutcomeRecorder port; the
# adapter that calls operations lives in the composition root. A direct import
# would give metrics.json a second writer.
name = "Reconciliation reaches operations only through its port"
type = "forbidden"
source_modules = ["xcron_libs.capabilities.reconciliation"]
forbidden_modules = ["xcron_libs.capabilities.operations"]

[[tool.importlinter.contracts]]
# Settings are composed once and passed down as values. A capability importing
# the loader would resolve configuration a second time, at a different moment.
name = "Only the composition root loads settings"
type = "forbidden"
# Direct imports only. Everything reaches the composition root eventually —
# that is what a composition root is for — so an indirect chain here says
# nothing. The claim is that no file outside `runtime` *names* the loader.
allow_indirect_imports = true
source_modules = [
  "xcron_libs.capabilities",
  "xcron_libs.sdk",
  "xcron_libs.domain",
  "xcron_libs.shared",
  "xcron_cli",
]
forbidden_modules = ["xcron_libs.configuration"]

[[tool.importlinter.contracts]]
# The library half is embeddable. A renderer below the channel boundary decides
# on the embedder's behalf that it has a terminal.
name = "No terminal below the channel boundary"
type = "forbidden"
source_modules = ["xcron_libs"]
forbidden_modules = ["typer", "rich", "toon", "click"]

[[tool.importlinter.contracts]]
name = "Nothing under libs knows a channel exists"
type = "forbidden"
source_modules = ["xcron_libs"]
forbidden_modules = ["xcron_cli"]

[[tool.importlinter.contracts]]
# The deleted packages. Import Linter cannot see a module that does not exist,
# so this contract is about the day someone recreates one.
name = "The ownerless packages stay deleted"
type = "forbidden"
source_modules = ["xcron_cli", "xcron_libs"]
forbidden_modules = [
  "xcron_libs.actions",
  "xcron_libs.services",
  "xcron_libs.infra",
  "xcron_resources",
]
