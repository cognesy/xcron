[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.uv.workspace]
# Every implementation is an independently buildable workspace member. The
# root is metadata-only: it publishes the default SDK/provider aggregate.
members = ["packages/*", "capabilities/*"]

[tool.uv.sources]
xcron-contracts = { workspace = true }
xcron-capability-workspace-local = { workspace = true }
xcron-capability-settings-xcfg = { workspace = true }
xcron-capability-observability-structlog = { workspace = true }
xcron-capability-manifest-yaml = { workspace = true }
xcron-capability-scheduler-native = { workspace = true }
xcron-capability-jobs-manifest = { workspace = true }
xcron-capability-logs-local = { workspace = true }
xcron-capability-metrics-local = { workspace = true }
xcron-capability-agent-hooks-local = { workspace = true }
xcron-kernel = { workspace = true }
xcron-testing = { workspace = true }
xcron-sdk = { workspace = true }
xcron-cli = { workspace = true }

[project]
name = "xcron"
version = "0.1.4"
description = "Per-project schedule reconciliation prototype for native OS schedulers"
readme = "SPEC.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [
  { name = "Dariusz Debowczyk" }
]
# The aggregate library distribution: the SDK and one selected default provider
# for every capability.  The CLI remains an opt-in channel, so an embedder gets
# the complete programmatic surface without terminal renderers.
dependencies = [
  "xcron-sdk==0.1.4",
  "xcron-capability-workspace-local==0.1.4",
  "xcron-capability-settings-xcfg==0.1.4",
  "xcron-capability-observability-structlog==0.1.4",
  "xcron-capability-manifest-yaml==0.1.4",
  "xcron-capability-scheduler-native==0.1.4",
  "xcron-capability-jobs-manifest==0.1.4",
  "xcron-capability-logs-local==0.1.4",
  "xcron-capability-metrics-local==0.1.4",
  "xcron-capability-agent-hooks-local==0.1.4",
]

[project.optional-dependencies]
# The `xcron` console script is a CLI channel, so it needs the channel's
# renderers. No provider or SDK module may import `xcron_cli`; the architecture
# tests enforce that, which is what makes this split safe rather than cosmetic.
cli = [
  "xcron-cli==0.1.4",
]
dev = [
  "pytest>=8.0,<9.0",
]

# The test suite exercises the CLI channel, so a bare `uv run pytest` has to
# see the `cli` extra. uv installs this group by default, which is what keeps
# the split from turning every CLI test red.
[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "xcron[cli]",
  "xcron-capability-workspace-local==0.1.4",
  "xcron-capability-settings-xcfg==0.1.4",
  "xcron-capability-observability-structlog==0.1.4",
  "xcron-capability-manifest-yaml==0.1.4",
  "xcron-capability-scheduler-native==0.1.4",
  "xcron-capability-jobs-manifest==0.1.4",
  "xcron-capability-logs-local==0.1.4",
  "xcron-capability-metrics-local==0.1.4",
  "xcron-capability-agent-hooks-local==0.1.4",
  "xcron-contracts==0.1.4",
  "xcron-kernel==0.1.4",
  "xcron-testing==0.1.4",
  "xcron-sdk==0.1.4",
  "xcron-cli==0.1.4",
]

[tool.setuptools]
# xcron is a dependency-only aggregate. Importable modules live exclusively in
# the kernel, contracts, SDK, CLI, and selected provider distributions.
packages = []

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "packages/xcron-contracts/tests",
  "packages/xcron-kernel/tests",
  "packages/xcron-testing/tests",
  "packages/xcron-sdk/tests",
  "packages/xcron-cli/tests",
  "capabilities/xcron-capability-workspace-local/tests",
  "capabilities/xcron-capability-settings-xcfg/tests",
  "capabilities/xcron-capability-observability-structlog/tests",
  "capabilities/xcron-capability-manifest-yaml/tests",
  "capabilities/xcron-capability-scheduler-native/tests",
  "capabilities/xcron-capability-jobs-manifest/tests",
  "capabilities/xcron-capability-logs-local/tests",
  "capabilities/xcron-capability-metrics-local/tests",
  "capabilities/xcron-capability-agent-hooks-local/tests",
  "ops/control/tests",
  "ops/version/tests",
]
