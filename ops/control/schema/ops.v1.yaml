$schema: https://json-schema.org/draft/2020-12/schema
title: xcron operations catalogue
type: object
additionalProperties: false
required:
  - schema_version
  - active
properties:
  $schema:
    type: string
  schema_version:
    const: xcron-ops/v1
  active:
    type: object
    minProperties: 1
    additionalProperties:
      type: string
      pattern: ^[a-z][a-z0-9-]*$
