$schema: https://json-schema.org/draft/2020-12/schema
title: xcron operations capability
type: object
additionalProperties: false
required:
  - schema_version
  - id
  - provides
  - description
  - status
  - requires
  - owns
  - reads
  - generates
  - commands
  - skills
properties:
  $schema:
    type: string
  schema_version:
    const: xcron-ops-capability/v1
  id:
    type: string
    pattern: ^[a-z][a-z0-9-]*$
  provides:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: ^[a-z][a-z0-9-]*$
  description:
    type: string
    minLength: 1
  status:
    enum: [active, experimental, deprecated]
  requires:
    type: object
    additionalProperties: false
    required: [tools, capabilities]
    properties:
      tools:
        type: array
        uniqueItems: true
        items:
          type: string
      capabilities:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z][a-z0-9-]*$
  owns:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: ^ops/.+$
  reads:
    type: array
    uniqueItems: true
    items:
      type: string
  generates:
    type: array
    uniqueItems: true
    items:
      type: string
  commands:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [name, summary, lane]
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9-]*$
        summary:
          type: string
          minLength: 1
        lane:
          enum: [discover, check, test, distribution, diagnostic, workflow]
        aggregate:
          enum: [check, test]
        args:
          type: string
  skills:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [name, summary]
      properties:
        name:
          type: string
        summary:
          type: string
          minLength: 1
