$schema: ../control/schema/capability.v1.yaml
schema_version: xcron-ops-capability/v1
id: distribution
provides:
  - distribution-verification
description: Build all workspace wheels and prove aggregate, lean SDK, CLI, and replacement installs.
status: active
requires:
  tools: [uv]
  capabilities: [quality]
owns:
  - ops/distribution/**
reads:
  - pyproject.toml
  - scripts/verify-wheel.sh
  - packages/**
  - capabilities/**
generates:
  - build/**
  - dist/**
commands:
  - name: wheel
    summary: Run the full clean-wheel verification matrix.
    lane: distribution
  - name: packages
    summary: Inspect wheel contents and install each provider with its declared closure.
    lane: distribution
  - name: aggregate
    summary: Install the default SDK and provider aggregate without a terminal channel.
    lane: distribution
  - name: lean
    summary: Install only kernel, contracts, and SDK and exercise typed failure diagnostics.
    lane: distribution
  - name: alternate
    summary: Demonstrate explicit selection of an alternate metrics provider.
    lane: distribution
  - name: cli
    summary: Install xcron[cli] and prove the console script and packaged help assets.
    lane: distribution
skills: []
