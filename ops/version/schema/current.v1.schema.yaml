$schema: https://json-schema.org/draft/2020-12/schema
title: xcron release version record
type: object
additionalProperties: false
required:
  - schema_version
  - product
  - product_version
  - description
properties:
  schema_version:
    const: 1
  product:
    const: xcron
  product_version:
    type: string
    pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
  description:
    type: string
    minLength: 1
