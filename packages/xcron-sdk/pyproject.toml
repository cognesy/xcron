[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xcron-sdk"
version = "0.1.0"
description = "Typed, capability-hosted Python client for xcron"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
  "xcron-contracts==0.1.0",
  "xcron-kernel==0.1.0",
]

[tool.uv.sources]
xcron-contracts = { workspace = true }
xcron-kernel = { workspace = true }

[tool.setuptools]
packages = ["xcron.sdk"]

[tool.setuptools.package-dir]
"" = "src"
