[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xcron-contracts"
version = "0.1.2"
description = "Typed provider-neutral contracts for xcron capability packages"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
  "pydantic>=2.12.5",
]

[tool.setuptools]
packages = ["xcron.contracts"]

[tool.setuptools.package-dir]
"" = "src"
