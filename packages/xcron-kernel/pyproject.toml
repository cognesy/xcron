[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xcron-kernel"
version = "0.1.3"
description = "Minimal capability-neutral xcron composition kernel"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
  "packaging>=24,<26",
]

[tool.setuptools]
include-package-data = true
packages = ["xcron.kernel", "xcron.kernel.resources"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"xcron.kernel" = ["resources/*.txt"]
