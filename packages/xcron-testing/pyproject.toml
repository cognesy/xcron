[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xcron-testing"
version = "0.1.4"
description = "Conformance and package-layout checks for xcron providers"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
  "xcron-contracts==0.1.4",
  "xcron-kernel==0.1.4",
]

[tool.uv.sources]
xcron-contracts = { workspace = true }
xcron-kernel = { workspace = true }

[tool.setuptools]
packages = ["xcron.testing"]

[tool.setuptools.package-dir]
"" = "src"
